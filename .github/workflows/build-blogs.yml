name: Build blog pages

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'legacy/blog.html'
      - 'templates/**'
      - 'scripts/build-blogs.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate blog pages
        run: npm run build
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html blogs
          if git diff --cached --quiet; then
            echo "Generated blog pages are already up to date."
          else
            git commit -m "Build blog pages"
            git push
          fi
