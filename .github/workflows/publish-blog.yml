name: Publish blog from issue form

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[Blog]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Allow repository owner only
        if: github.event.issue.user.login != github.repository_owner
        run: |
          echo "Only the repository owner can publish through this form."
          exit 1
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Markdown post from form
        env:
          ISSUE_BODY: ${{ toJSON(github.event.issue.body) }}
          ISSUE_TITLE: ${{ toJSON(github.event.issue.title) }}
        run: node scripts/publish-issue.js
      - name: Generate blog pages
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit new blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts blogs blog.html
          git commit -m "Publish blog from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
      - name: Confirm publishing
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The blog was generated and committed to main. GitHub Pages deployment may take a few minutes."
          gh issue close "$ISSUE_NUMBER" --reason completed
